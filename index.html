<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaqCheck – MC23</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MaqCheck">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --navy:#1f3864; --navy2:#2b4a7e; --ink:#1b1f24; --mut:#5b6573; --bg:#eef1f5; --card:#fff; --ok:#2e7d32; --amb:#9c6500; --red:#c00000; --acc:#c55a11; --line:#dde2ea; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .top { background:var(--navy); color:#fff; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5 }
  .top .marca { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.3px }
  .top .marca img { width:28px; height:28px; border-radius:6px }
  .top .marca small { display:block; font-weight:400; font-size:11px; opacity:.8; letter-spacing:0 }
  .chip { background:rgba(255,255,255,.14); border:0; color:#fff; border-radius:999px; padding:7px 12px; font-size:13px; max-width:55vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  main { max-width:560px; margin:0 auto; padding-bottom:calc(32px + env(safe-area-inset-bottom)) }
  .card { background:var(--card); margin:14px; border-radius:14px; padding:18px; box-shadow:0 1px 2px rgba(16,24,40,.08) }
  .cod { font-size:32px; font-weight:800; margin:0; letter-spacing:.3px } .desc { font-size:17px; margin:4px 0 12px; color:#333 }
  .nr { display:inline-block; background:var(--ink); color:#fff; border-radius:6px; padding:3px 9px; font-weight:700; font-size:13px }
  .row { margin-top:9px; font-size:14px; color:#444 } .row b { color:#222 }
  .btn { display:block; width:calc(100% - 28px); text-align:center; text-decoration:none; font-weight:700; font-size:17px; border-radius:12px; padding:16px; margin:10px 14px; color:#fff; background:var(--acc); border:0; font-family:inherit; cursor:pointer }
  .btn.sec { background:var(--ok) } .btn.nav { background:var(--navy) } .btn.res { background:#5d4037 }
  .btn.out { background:#fff; color:var(--navy); border:2px solid var(--navy) } .btn.res.out { color:#5d4037; border-color:#5d4037 }
  .btn:disabled { opacity:.5 }
  .lnk { display:block; text-align:center; color:var(--navy); font-size:14px; margin:6px 14px 12px; }
  .off { display:block; text-align:center; color:#777; border:1px dashed #aaa; border-radius:10px; padding:13px; margin:10px 14px }
  .blq { background:var(--red); color:#fff; font-weight:700; text-align:center; padding:14px; margin:14px; border-radius:12px; font-size:17px }
  .atn { background:#fff4ce; color:#7a4f00; border:2px solid #e0a800; font-weight:700; text-align:center; padding:14px; margin:14px; border-radius:12px; font-size:16px }
  .blq small, .atn small { display:block; font-weight:400; font-size:13px; margin-top:6px }
  .lib { color:var(--ok); font-weight:700 } .pend { color:var(--amb); font-weight:700 } .bad { color:var(--red); font-weight:700 }
  .sub { font-size:12px; font-weight:700; color:#5b6573; margin:18px 16px 0; text-transform:uppercase; letter-spacing:.6px }
  .passos { display:flex; gap:4px; margin:6px 14px 0; font-size:10.5px; text-align:center }
  .passos span { flex:1; padding:6px 2px; border-radius:6px; background:#dfe4ec; color:#666 }
  .passos span.at { background:var(--navy); color:#fff; font-weight:700 } .passos span.ok { background:#dbe8d6; color:#2e5e2a }
  details.mais { margin:4px 14px 10px } details.mais summary { color:var(--navy); font-size:14px; padding:6px 2px }
  details.mais .btn { width:100%; margin:8px 0 }
  .banner { margin:10px 14px 0; padding:10px 12px; border-radius:10px; background:#e8eefb; color:#1f3864; font-size:14px }
  .banner.warn { background:#fff4ce; color:#7a4f00 }
  label.f { display:block; font-size:13px; color:var(--mut); margin:14px 0 6px; font-weight:600 }
  input.t, textarea.t { width:100%; font-size:18px; padding:13px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; background:#fff }
  input.t:focus, textarea.t:focus { outline:none; border-color:var(--navy2) }
  .erro { color:var(--red); font-size:14px; margin-top:10px; min-height:18px }
  .prog { height:6px; background:#dfe4ec; border-radius:6px; margin:6px 0 2px; overflow:hidden } .prog i { display:block; height:100%; background:var(--ok); width:0 }
  .item { padding:14px 0; border-top:1px solid var(--line) } .item:first-of-type { border-top:0 }
  .item p { margin:0 0 10px; font-size:16px; line-height:1.35 }
  .crit { display:inline-block; font-size:11px; font-weight:700; color:#fff; background:var(--red); border-radius:4px; padding:1px 6px; margin-left:6px; vertical-align:2px }
  .seg { display:flex; gap:6px } .seg button { flex:1; padding:12px 4px; font-size:15px; font-weight:700; border-radius:10px; border:1.5px solid var(--line); background:#fff; color:#444; font-family:inherit }
  .seg button.s-ok.on { background:var(--ok); border-color:var(--ok); color:#fff }
  .seg button.s-nc.on { background:var(--red); border-color:var(--red); color:#fff }
  .seg button.s-na.on { background:#6b7280; border-color:#6b7280; color:#fff }
  .opc button { display:block; width:100%; text-align:left; padding:14px; margin:8px 0; font-size:16px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-family:inherit; color:#222 }
  .opc button.on { border-color:var(--navy); background:#e8eefb; font-weight:700 }
  .fotos { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px } .fotos img { width:76px; height:76px; object-fit:cover; border-radius:8px }
  .seg button.s-x.on { background:var(--navy); border-color:var(--navy); color:#fff }
  .gl { padding:12px 0; border-top:1px solid var(--line) } .gl:first-of-type { border-top:0 } .gl p { margin:0 0 8px; font-size:15px }
  .todos { background:none; border:1.5px dashed var(--ok); color:var(--ok); font-weight:700; border-radius:10px; padding:10px; width:100%; margin:4px 0 6px; font-family:inherit; font-size:14px }
  .obr { color:var(--red) }
  .ok-big { text-align:center; padding:28px 18px } .ok-big .m { width:72px; height:72px; border-radius:50%; background:var(--ok); color:#fff; font-size:40px; line-height:72px; margin:0 auto 12px }
  .rec a { display:flex; justify-content:space-between; padding:12px 2px; border-top:1px solid var(--line); text-decoration:none; color:var(--ink) } .rec a:first-child { border-top:0 }
  .foot { font-size:11px; color:#8a93a0; text-align:center; margin:18px }
  .load { text-align:center; color:#666; margin:48px 16px }
  video#cam { width:100%; border-radius:12px; background:#000 }
</style>
</head>
<body>
<div class="top"><div class="marca"><img src="/icon.svg" alt=""><div>MaqCheck<small>MC23 Engenharia · SST</small></div></div><button class="chip" id="quem" hidden></button></div>
<main id="app"><p class="load">Carregando…</p></main>
<div class="foot">MC23 Engenharia · <a href="https://www.mc23.com.br" style="color:#8a93a0">www.mc23.com.br</a></div>
<script>
/* ===== Configuração ===== */
const API = 'https://script.google.com/macros/s/AKfycbzo3Sg2882lwgysTgXNiQK3PZfScptSl4er7Jdj59u0820Czxlg04btl6id14nDtQM/exec';
const CSV_ATIVOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT50D-kZo9oGv1OiTLn5ALf5O3d0z5spQrNeNSUF3ckG8huUwDMHSEbxAuEXZBazL3ea51RH69iPzTN/pub?gid=2098913993&single=true&output=csv';
const CSV_STATUS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT50D-kZo9oGv1OiTLn5ALf5O3d0z5spQrNeNSUF3ckG8huUwDMHSEbxAuEXZBazL3ea51RH69iPzTN/pub?gid=1912443581&single=true&output=csv';

const q = new URLSearchParams(location.search);
let ALT = {}, PAINEL = q.get('painel') === '1';
let CLI = (q.get('c') || '').trim().toUpperCase(), COD = (q.get('a') || '').trim().toUpperCase();
const app = document.getElementById('app'), quem = document.getElementById('quem');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const codDe = s => String(s || '').split(' – ')[0].trim().toUpperCase();
const ehLink = s => /^https:\/\/(docs\.google\.com|forms\.gle)\//.test(String(s || ''));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ===== Sessão do operador (matrícula + PIN; vale o turno) ===== */
function sessao() { const s = ls.get('mq_sessao', null); return s && s.validade > Date.now() ? s : null; }
function mostraQuem() {
  const s = sessao();
  quem.hidden = !s; if (s) quem.textContent = s.nome.split(' ')[0] + ' · sair';
}
quem.onclick = () => { if (confirm('Sair do MaqCheck neste celular?')) { localStorage.removeItem('mq_sessao'); mostraQuem(); rota(); } };

/* ===== Rede ===== */
async function api(dados) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(dados) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function csv(text) {
  const rows = []; let row = [], cell = '', inq = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inq) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') inq = false; else cell += ch; }
    else if (ch === '"') inq = true; else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; } else if (ch !== '\r') cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
async function pega(url) { const r = await fetch(url + '&t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return csv(await r.text()); }

/* ===== Fila sem sinal ===== */
function fila() { return ls.get('mq_fila', []); }
async function enviaFila() {
  const f = fila(); if (!f.length || !navigator.onLine) return;
  const resto = [];
  for (const item of f) {
    try { let r = await api(item); if (r.horBaixo) { item.confirmaHor = true; r = await api(item); } if (!r.ok && !r.sair) resto.push(item); } catch (e) { resto.push(item); }
  }
  ls.set('mq_fila', resto);
  const b = document.getElementById('fila'); if (b) b.outerHTML = bannerFila();
}
function bannerFila() { const n = fila().length; return n ? '<div class="banner warn" id="fila">' + n + ' registro(s) guardado(s) aguardando sinal – envio automático.</div>' : '<span id="fila"></span>'; }
window.addEventListener('online', enviaFila);

/* ===== Rotas ===== */
function rota() { mostraQuem(); if (COD) ficha(); else if (PAINEL) avisos(); else inicio(); }
const gestor = () => { const s = sessao(); return s && s.perfil && s.perfil !== 'Operador'; };
function vaiPara(cli, cod) { history.pushState(null, '', '/?c=' + encodeURIComponent(cli) + '&a=' + encodeURIComponent(cod)); CLI = cli; COD = cod; rota(); }
window.addEventListener('popstate', () => { const p = new URLSearchParams(location.search); CLI = (p.get('c') || '').toUpperCase(); COD = (p.get('a') || '').toUpperCase(); rota(); });

/* ----- Início (app aberto pela tela inicial) ----- */
function inicio() {
  const rec = ls.get('mq_recentes', []), s = sessao();
  app.innerHTML = bannerFila() +
    '<div class="card"><h2 style="margin:0 0 6px">Escaneie o QR do equipamento</h2><p class="row" style="margin:0">Use a câmera do celular na etiqueta MaqCheck. ' + (s ? 'Você está como <b>' + esc(s.nome) + '</b>.' : '') + '</p></div>' +
    ('BarcodeDetector' in window ? '<button class="btn nav" id="ler">LER QR AGORA</button>' : '') +
    '<button class="btn out" id="painel">' + (gestor() ? 'AVISOS ABERTOS – DECIDIR' : 'SOU ENCARREGADO / SST') + '</button>' +
    '<div class="card"><label class="f" style="margin-top:0">Ou digite o código da etiqueta</label>' +
    '<div style="display:flex;gap:8px"><input class="t" id="cli" placeholder="Empresa" value="' + esc(CLI || (s && s.cli) || '') + '" style="width:34%;text-transform:uppercase">' +
    '<input class="t" id="cod" placeholder="Ex.: ZI-EMP-01" style="text-transform:uppercase"></div>' +
    '<button class="btn sec" id="abrir" style="width:100%;margin:12px 0 0">ABRIR</button></div>' +
    (rec.length ? '<p class="sub">Recentes</p><div class="card rec">' + rec.map(r => '<a href="/?c=' + esc(r.c) + '&a=' + esc(r.a) + '"><span><b>' + esc(r.a) + '</b> ' + esc(r.d) + '</span><span>›</span></a>').join('') + '</div>' : '');
  document.getElementById('abrir').onclick = () => {
    const c = document.getElementById('cli').value.trim().toUpperCase(), a = document.getElementById('cod').value.trim().toUpperCase();
    if (c && a) vaiPara(c, a);
  };
  const ler = document.getElementById('ler'); if (ler) ler.onclick = lerQR;
  document.getElementById('painel').onclick = () => { PAINEL = true; history.pushState(null, '', '/?painel=1'); avisos(); };
  enviaFila();
}
async function lerQR() {
  app.innerHTML = '<div class="card"><video id="cam" playsinline muted></video><p class="row">Aponte para a etiqueta.</p></div><button class="btn out" id="cancela">CANCELAR</button>';
  let stream, parar = false;
  document.getElementById('cancela').onclick = () => { parar = true; stream && stream.getTracks().forEach(t => t.stop()); inicio(); };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = document.getElementById('cam'); v.srcObject = stream; await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    while (!parar) {
      const r = await det.detect(v).catch(() => []);
      if (r.length) {
        stream.getTracks().forEach(t => t.stop());
        try { const u = new URL(r[0].rawValue); const c = u.searchParams.get('c'), a = u.searchParams.get('a'); if (a) return vaiPara((c || '').toUpperCase(), a.toUpperCase()); } catch (e) {}
        return inicio();
      }
      await new Promise(ok => setTimeout(ok, 250));
    }
  } catch (e) { app.innerHTML = '<div class="card"><p>Não foi possível abrir a câmera. Use a câmera do celular na etiqueta.</p></div>'; setTimeout(inicio, 2500); }
}

/* ----- Ficha do equipamento ----- */
async function ficha() {
  app.innerHTML = '<p class="load">Carregando a ficha do equipamento…</p>';
  let ativos, status = [];
  try { ativos = await pega(CSV_ATIVOS); ls.set('mq_csv_' + CLI, ativos); }
  catch (e) { ativos = ls.get('mq_csv_' + CLI, null); }
  if (!ativos) { app.innerHTML = '<div class="card"><p class="cod">' + esc(COD) + '</p><p class="desc">Sem sinal e sem dados guardados deste equipamento. Tente de novo com internet.</p></div>'; return; }
  try { status = await pega(CSV_STATUS); } catch (e) {}
  const h = ativos[0] || [], ix = n => h.indexOf(n);
  const row = ativos.slice(1).find(r => String(r[ix('Código')] || '').trim().toUpperCase() === COD && (!CLI || String(r[ix('Cliente')] || '').trim().toUpperCase() === CLI));
  if (!row) { app.innerHTML = '<div class="card"><p class="cod">' + esc(COD) + '</p><p class="desc">Equipamento não cadastrado' + (CLI ? ' para ' + esc(CLI) : '') + '.</p><p class="row">Avise o técnico de segurança ou a MC23 Engenharia.</p></div>'; return; }
  const g = n => row[ix(n)] || '';
  if (!CLI) CLI = g('Cliente').toUpperCase();
  const rec = ls.get('mq_recentes', []).filter(r => !(r.c === CLI && r.a === COD)); rec.unshift({ c: CLI, a: COD, d: g('Descrição') }); ls.set('mq_recentes', rec.slice(0, 8));
  let ult = null;
  for (let i = status.length - 1; i >= 1; i--) { const s = status[i]; if (codDe(s[1]) === COD && String(s[0]).toUpperCase() === CLI) { ult = { data: s[2], res: s[3], nc: s[4] }; break; } }
  const sit = ult ? String(ult.res).toUpperCase() : '', verm = /^(PARADO|EM MANUTEN|BLOQ)/.test(sit), amar = /^(ATEN|AGUARD)/.test(sit);
  const ops = g('Operadores habilitados');
  let html = bannerFila() + '<div class="card"><p class="cod">' + esc(g('Código')) + '</p><p class="desc">' + esc(g('Descrição')) + '</p><span class="nr">' + esc(g('NR')) + '</span>' +
    '<div class="row"><b>Tipo:</b> ' + esc(g('Tipo')) + '</div><div class="row"><b>Local:</b> ' + esc(g('Local')) + '</div>' +
    (g('Modalidade') ? '<div class="row"><b>Uso:</b> ' + esc(g('Modalidade')) + '</div>' : '') +
    (g('Responsabilidade') ? '<div class="row"><b>Responsabilidade:</b> ' + esc(g('Responsabilidade')) + '</div>' : '') +
    (ops ? '<div class="row"><b>Operadores habilitados:</b> ' + (/^0 /.test(ops) ? '<span class="bad">nenhum com treinamento válido</span>' : esc(ops)) + '</div>' : '') +
    (ult ? '<div class="row"><b>Último checklist:</b> ' + esc(ult.data) + ' – <span class="' + (verm ? 'bad' : amar ? 'pend' : 'lib') + '">' + esc(ult.res) + '</span></div>' : '') + '</div>';
  if (/^Em manuten/.test(g('Modalidade'))) html += '<div class="blq">EM MANUTENÇÃO – NÃO LOCAR<small>Aguardando a liberação da mecânica.</small></div>';
  else if (verm) html += '<div class="blq">' + esc(ult.res) + (ult.nc ? '<small>' + esc(ult.nc) + '</small>' : '') + '</div>';
  else if (amar) html += '<div class="atn">' + esc(ult.res) + (ult.nc ? '<small>' + esc(ult.nc) + '</small>' : '') + '<small>O responsável da área foi avisado e vai avaliar.</small></div>';
  const pt = ehLink(g('Link PT')) ? g('Link PT') : '', chkForm = ehLink(g('Link checklist (gerado)')) ? g('Link checklist (gerado)') : '';
  if (pt) html += '<a class="btn" href="' + esc(pt) + '">EMITIR PERMISSÃO DE TRABALHO (NR-10)</a>';
  if (chkForm) html += '<button class="btn sec" id="fazer">FAZER CHECKLIST</button><a class="lnk" href="' + esc(chkForm) + '">Abrir no formulário (alternativa)</a>';
  else if (!pt) html += '<span class="off">Checklist online – em implantação</span>';
  const L = n => ehLink(g(n)) ? g(n) : '';
  const et = [['ENTREGA', 'ENTREGA AO LOCATÁRIO', L('Link entrega'), 'ENT'], ['RETIRADA', 'PEDIR RETIRADA (FIM DA LOCAÇÃO)', L('Link retirada'), 'RET'], ['COLETA', 'COLETA – MOTORISTA', L('Link coleta'), 'COL'],
              ['CHEGADA', 'CHEGADA AO PÁTIO – DEVOLUÇÃO', L('Link devolução'), 'DEV'], ['LIBERAÇÃO', 'LIBERAR PARA NOVA LOCAÇÃO', L('Link liberação'), 'LIB']];
  ALT = { ENT: et[0][2], RET: et[1][2], COL: et[2][2], DEV: et[3][2], LIB: et[4][2], RES: L('Link resíduo'), RESD: L('Link destinação de resíduos') };
  if (et.some(e => e[2])) {
    const uso = g('Modalidade'), at = /^(Locado|De terceiro)/.test(uso) ? 1 : /^Retirada/.test(uso) ? 2 : /^Em trânsito/.test(uso) ? 3 : /^Em manuten/.test(uso) ? 4 : 0;
    html += '<p class="sub">Locação</p><div class="passos">' + et.map((e, i) => '<span class="' + (i === at ? 'at' : i < at ? 'ok' : '') + '">' + e[0] + '</span>').join('') + '</div>';
    if (et[at][2]) html += '<button class="btn nav" data-f="' + et[at][3] + '">' + et[at][1] + '</button>';
    const out = et.filter((e, i) => i !== at && e[2]);
    if (out.length) html += '<details class="mais"><summary>Outras etapas</summary>' + out.map(e => '<button class="btn out" data-f="' + e[3] + '">' + e[1] + '</button>').join('') + '</details>';
  }
  const res = L('Link resíduo'), resd = L('Link destinação de resíduos');
  if (res || resd) {
    html += '<p class="sub">Resíduos</p>';
    if (res) html += '<button class="btn res" data-f="RES">REGISTRAR RESÍDUO (ÓLEO, FILTRO, BATERIA, PNEU)</button>';
    if (resd) html += '<button class="btn res' + (res ? ' out' : '') + '" data-f="RESD">COLETA / DESTINAÇÃO (MTR E CDF)</button>';
  }
  app.innerHTML = html; document.title = g('Código') + ' – MaqCheck';
  const b = document.getElementById('fazer'); if (b) b.onclick = () => sessao() ? checklist() : login(checklist);
  app.querySelectorAll('[data-f]').forEach(x => x.onclick = () => etapa(x.dataset.f));
  if (gestor()) { app.insertAdjacentHTML('beforeend', '<button class="btn out" id="vav">AVISOS ABERTOS – DECIDIR</button>'); document.getElementById('vav').onclick = () => avisos(COD); }
  enviaFila();
}

/* ----- Login ----- */
function login(depois) {
  app.innerHTML = '<div class="card"><h2 style="margin:0 0 4px">Identificação</h2><p class="row" style="margin:0">Entre com sua matrícula e o PIN entregue pelo SST. Vale até o fim do turno neste celular.</p>' +
    '<label class="f">Empresa</label><input class="t" id="lcli" value="' + esc(CLI) + '" ' + (CLI ? 'readonly' : '') + ' style="text-transform:uppercase">' +
    '<label class="f">Matrícula</label><input class="t" id="lmat" inputmode="numeric" autocomplete="username">' +

  };
}
function reduz(file) {
  return new Promise(ok => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const m = 1280, k = Math.min(1, m / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.7)); };
    img.onerror = () => ok(''); img.src = url;
  });
}

/* ----- Etapas de campo (frota e resíduos) – o app desenha o formulário do sistema ----- */
async function etapa(tipo) {
  const s = sessao();
  app.innerHTML = '<p class="load">Abrindo…</p>';
  let def = ls.get('mq_form_' + tipo, null);
  try { const r = await api({ acao: 'form', tipo, token: s && s.cli === CLI ? s.token : '' }); if (r.ok) { def = r; ls.set('mq_form_' + tipo, r); } } catch (e) {}
  const alt = ALT[tipo] ? '<a class="lnk" href="' + esc(ALT[tipo]) + '">Abrir no formulário (alternativa)</a>' : '';
  if (!def) { app.innerHTML = '<div class="card"><p>Sem sinal para abrir esta etapa.</p></div>' + alt + '<button class="btn out" onclick="rota()">VOLTAR</button>'; return; }
  if (def.exigeLogin && (!s || s.cli !== CLI)) { if (s) localStorage.removeItem('mq_sessao'); return login(() => etapa(tipo)); }
  const v = {}, fotos = [], hoje = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const cls = (c, j) => j === 0 ? 's-ok' : /^Não conforme|^Avaria|^Falta|^Ruim|^Não/.test(c) ? 's-nc' : /aplica/i.test(c) ? 's-na' : 's-x';
  const campo = (it, k) => {
    const lb = '<label class="f">' + esc(it.titulo) + (it.obrig ? ' <span class="obr">*</span>' : '') + '</label>' + (it.ajuda ? '<p class="row" style="margin:-2px 0 6px;font-size:12px">' + esc(it.ajuda) + '</p>' : '');
    if (it.tipo === 'texto') { v[it.id] = it.padrao || ''; return lb + '<input class="t" data-k="' + k + '" value="' + esc(it.padrao || '') + '"' + (/hor[ií]metro|quantidade/i.test(it.titulo) ? ' inputmode="decimal"' : '') + '>'; }
    if (it.tipo === 'paragrafo') return lb + '<textarea class="t" data-k="' + k + '" rows="3"></textarea>';
    if (it.tipo === 'data') { v[it.id] = hoje; return lb + '<input class="t" type="date" data-k="' + k + '" value="' + hoje + '">'; }
    if (it.tipo === 'escolha' || it.tipo === 'caixas') { v[it.id] = it.tipo === 'caixas' ? [] : ''; return lb + '<div class="opc" data-k="' + k + '">' + it.opcoes.map((o, j) => '<button data-j="' + j + '">' + esc(o) + '</button>').join('') + '</div>'; }
    if (it.tipo === 'grade') { v[it.id] = it.linhas.map(() => '');
      return lb + '<div class="card" style="margin:0;padding:6px 12px;border:1px solid var(--line);box-shadow:none"><button class="todos" data-todos="' + k + '">TODOS: ' + esc(it.colunas[0]).toUpperCase() + '</button>' +
        it.linhas.map((l, i) => '<div class="gl"><p>' + esc(l) + '</p><div class="seg" data-k="' + k + '" data-i="' + i + '">' + it.colunas.map((c, j) => '<button class="' + cls(c, j) + '" data-j="' + j + '">' + esc(c) + '</button>').join('') + '</div></div>').join('') + '</div>'; }
    return '';
  };
  app.innerHTML = '<div class="card"><p class="row" style="margin:0">' + esc(COD) + '</p><h2 style="margin:6px 0 2px;font-size:20px">' + esc(def.titulo) + '</h2>' +
    (s ? '<p class="row" style="margin:2px 0 0">Responsável: <b>' + esc(s.nome) + '</b></p>' : '') + '</div>' +

    '<button class="btn sec" id="env">ENVIAR</button>' + alt + '<button class="btn out" id="evolta">CANCELAR</button>';
  app.querySelectorAll('input[data-k],textarea[data-k]').forEach(x => x.oninput = () => { v[def.itens[+x.dataset.k].id] = x.value.trim(); });
  app.querySelectorAll('.opc[data-k]').forEach(g => g.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return; const it = def.itens[+g.dataset.k], o = it.opcoes[+b.dataset.j];
    if (it.tipo === 'caixas') { const a = v[it.id], i = a.indexOf(o); i < 0 ? a.push(o) : a.splice(i, 1); b.classList.toggle('on', i < 0); }
    else { v[it.id] = o; g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }
  });
  const marca = (g, j) => { const it = def.itens[+g.dataset.k]; v[it.id][+g.dataset.i] = it.colunas[j]; g.querySelectorAll('button').forEach((x, n) => x.classList.toggle('on', n === j)); };
  app.querySelectorAll('.seg[data-k]').forEach(g => g.onclick = ev => { const b = ev.target.closest('button'); if (b) marca(g, +b.dataset.j); });
  app.querySelectorAll('[data-todos]').forEach(b => b.onclick = () => app.querySelectorAll('.seg[data-k="' + b.dataset.todos + '"]').forEach(g => marca(g, 0)));
  document.getElementById('ft').onchange = async ev => {
    for (const f of [...ev.target.files].slice(0, 4 - fotos.length)) fotos.push(await reduz(f));
    document.getElementById('fts').innerHTML = fotos.map(x => '<img src="' + x + '">').join('');

    const bt = document.getElementById('env'); bt.disabled = true; bt.textContent = 'ENVIANDO…';
    try {
      const r = await api(dados);
      if (r.horBaixo) { bt.dataset.conf = '1'; er.textContent = r.erro; bt.disabled = false; bt.textContent = 'ENVIAR MESMO ASSIM'; return; }
      if (!r.ok) { if (r.sair) { localStorage.removeItem('mq_sessao'); mostraQuem(); } er.textContent = r.erro || 'Não foi possível enviar.'; bt.disabled = false; bt.textContent = 'ENVIAR'; return; }
      fimEtapa(true, r.msg || 'Registrado.', def.titulo);
    } catch (e) { const f = fila(); f.push(dados); ls.set('mq_fila', f); fimEtapa(false, 'Sem sinal: ficou guardado no celular e será enviado sozinho quando houver internet.', def.titulo); }
  };
}

  };

/* ----- Equipe (só SST): perfil e PIN de cada pessoa ----- */
async function equipe(busca) {
  const s = sessao(); if (!s) return login(() => equipe());
  app.innerHTML = '<p class="load">Carregando a equipe…</p>';
  let r; try { r = await api({ acao: 'equipe', token: s.token }); } catch (e) { r = { ok: false, erro: 'Sem sinal. A equipe precisa de internet.' }; }
  if (!r.ok) { app.innerHTML = '<div class="card"><p>' + esc(r.erro) + '</p></div><button class="btn out" onclick="avisos()">VOLTAR</button>'; return; }
  const tag = p => p === 'SST' ? '<span class="crit" style="background:var(--navy)">SST</span>' : p === 'Encarregado' ? '<span class="crit" style="background:var(--ok)">ENCARREGADO</span>' : '';
  const desenha = f => {
    const n = (f || '').toLowerCase(), l = r.equipe.filter(x => !n || x.nome.toLowerCase().includes(n) || x.mat.includes(n));
    document.getElementById('eql').innerHTML = l.map(x => '<a href="#" data-m="' + esc(x.mat) + '"><span><b>' + esc(x.nome) + '</b>' + tag(x.perfil) + '<br><small style="color:#667">Matrícula ' + esc(x.mat) + ' · ' + esc(x.treinos || '—') + ' · PIN ' + (x.pinProprio ? 'próprio' : 'padrão') + '</small></span><span>›</span></a>').join('') || '<p class="row">Ninguém encontrado.</p>';
    document.querySelectorAll('#eql [data-m]').forEach(a => a.onclick = ev => { ev.preventDefault(); editaPessoa(r.equipe.find(x => x.mat === a.dataset.m), document.getElementById('eqb').value); });
  };
  app.innerHTML = '<div class="card"><h2 style="margin:0 0 4px">Equipe – ' + esc(s.cli) + '</h2><p class="row" style="margin:0">' + r.equipe.length + ' pessoas. Toque para trocar o perfil ou o PIN.</p>' +
    '<input class="t" id="eqb" placeholder="Buscar nome ou matrícula" style="margin-top:12px" value="' + esc(busca || '') + '"></div><div class="card rec" id="eql"></div><button class="btn out" id="eqv">VOLTAR AOS AVISOS</button>';
  document.getElementById('eqb').oninput = ev => desenha(ev.target.value);
  document.getElementById('eqv').onclick = () => avisos();
  desenha(busca);
}
function editaPessoa(x, busca) {
  let perfil = x.perfil;
  const P = ['Operador', 'Encarregado', 'SST'];
  app.innerHTML = '<div class="card"><p class="row" style="margin:0">Matrícula ' + esc(x.mat) + '</p><h2 style="margin:6px 0 2px;font-size:20px">' + esc(x.nome) + '</h2><div class="row">Treinamentos: ' + esc(x.treinos || '—') + '</div></div>' +
    '<div class="card"><label class="f" style="margin-top:0">Perfil no app</label><div class="seg" id="pf">' + P.map(p => '<button class="s-x' + (p === perfil ? ' on' : '') + '" data-p="' + p + '">' + p + '</button>').join('') + '</div>' +
    '<p class="row" style="font-size:12px">Operador: checklists e etapas. Encarregado: também decide os avisos. SST: também gerencia a equipe.</p>' +
    '<label class="f">PIN novo (4 a 8 números) – deixe vazio para manter</label><input class="t" id="pn" inputmode="numeric" maxlength="8" autocomplete="off">' +
    '<p class="row" style="font-size:12px">PIN atual: ' + (x.pinProprio ? 'próprio (definido pelo SST)' : 'padrão – 4 últimos dígitos da matrícula') + '.</p>' +
    (x.pinProprio ? '<button class="btn out" id="pdef" style="width:100%;margin:6px 0 0">VOLTAR AO PIN PADRÃO</button>' : '') +
    '<div class="erro" id="perr"></div></div><button class="btn sec" id="psv">SALVAR</button><button class="btn out" id="pvt">VOLTAR</button>';
  const pf = document.getElementById('pf');
  pf.onclick = ev => { const b = ev.target.closest('button'); if (!b) return; perfil = b.dataset.p; pf.querySelectorAll('button').forEach(z => z.classList.toggle('on', z === b)); };
  document.getElementById('pvt').onclick = () => equipe(busca);
  const salva = async pin => {
    const er = document.getElementById('perr'), bt = document.getElementById('psv'), s = sessao();
    if (pin && pin !== 'PADRAO' && !/^\d{4,8}$/.test(pin)) { er.textContent = 'O PIN precisa ter de 4 a 8 números.'; return; }
    bt.disabled = true; bt.textContent = 'SALVANDO…';
    try {
      const r = await api({ acao: 'equipeSalvar', token: s.token, mat: x.mat, perfil, pin });
      if (!r.ok) { er.textContent = r.erro; bt.disabled = false; bt.textContent = 'SALVAR'; return; }
      app.innerHTML = '<div class="card ok-big"><div class="m">✓</div><h2 style="margin:0 0 8px">Salvo</h2><p class="row">' + esc(r.msg) + '</p>' + (pin && pin !== 'PADRAO' ? '<p class="row"><b>Entregue o PIN pessoalmente.</b> Ele não aparece mais no app.</p>' : '') + '</div><button class="btn nav" id="pok">VOLTAR À EQUIPE</button>';
      document.getElementById('pok').onclick = () => equipe(busca);
    } catch (e) { er.textContent = 'Sem sinal. Tente de novo.'; bt.disabled = false; bt.textContent = 'SALVAR'; }
  };
  document.getElementById('psv').onclick = () => salva(document.getElementById('pn').value.trim());
  const pd = document.getElementById('pdef'); if (pd) pd.onclick = () => salva('PADRAO');
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
rota();
</script>
